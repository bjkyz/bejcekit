    <!--
      ★ STRUKTUROVANÁ DATA: KATALOG SLUŽEB + DOLOŽENÁ KVALIFIKACE.

      `OfferCatalog` je jediný typ, kterým se dá říct „tohle jsou moje služby
      a takhle se jmenují". `about` a `provider` míří na `#identity` z index.html,
      takže Google ví, že je to táž firma, ne druhá — kdyby se identita napsala
      znovu, vznikly by dvě a autorita by se nesečetla.

      `hasCredential` na osobě je certifikát z bloku „Kdo to staví". Není to
      ozdoba: u AI služeb je doložená kvalifikace přesně ten signál, který
      Google u odborných témat hodnotí (E-E-A-T), a `url` vede na skutečný
      dokument s ověřovacím QR kódem.
    -->

          },

            "sameAs": ["https://github.com/bjkyz"],

              "name": "Agentic Engineering",
              "description": "Architektura a principy AI agentů, tvorba a integrace MCP nástrojů, programové ovládání agentů, vývoj full-stack aplikací s AI, orchestrace agentů přes SDK. 20 vyučovacích hodin, 10 lekcí.",

              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI systémy: asistenti nad firemními daty, RAG, AI agenti a MCP nástroje" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Automatizace procesů: vytěžování dokumentů, propojení systémů, workflow" } },

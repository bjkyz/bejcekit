    <!--
      ★ SCHEMA.ORG: `CollectionPage` + `ItemList`, NE `Project`.
        `Project` je v schema.org podtyp **Organization** (sourozenec FundingAgency),
        tedy „organizovaný podnik". Použít ho na položku portfolia by Googlu řeklo,
        že každá reference je firma – což není drobnost, ale nepravdivé tvrzení
        ve strukturovaných datech.

        Weby jsou `CreativeWork` s `url`; `creator` míří přes `@id` na tentýž
        ProfessionalService, který je popsaný na úvodní stránce, takže se obě
        stránky slepí do jedné entity a ne do dvou konkurenčních.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "CollectionPage",
        "@id": "__SITE_ORIGIN__/projekty#page",
        "url": "__SITE_ORIGIN__/projekty",
        "name": "Projekty a reference · bejcek.it",
        "description": "Hotové weby od Jiřího Bejčka s živými odkazy a ověřitelnými technickými údaji.",
        "inLanguage": "cs",
        "about": { "@id": "__SITE_ORIGIN__/#identity" },
        "mainEntity": {
          "@type": "ItemList",
          "name": "Realizované weby",
          "itemListOrder": "https://schema.org/ItemListOrderAscending",
          "numberOfItems": 4,
          "itemListElement": [
            {
              "@type": "ListItem",
              "position": 1,
              "item": {
                "@type": "CreativeWork",
                "name": "Super Advokát",
                "url": "https://www.superadvokat.com",
                "description": "Právní služby online s pevnou cenou předem. Next.js, předrenderované stránky z CDN, strukturovaná data LegalService, hreflang.",
                "creator": { "@id": "__SITE_ORIGIN__/#identity" },
                "inLanguage": "cs"
              }
            },
            {
              "@type": "ListItem",
              "position": 2,
              "item": {
                "@type": "CreativeWork",
                "name": "Advokátní kancelář Tutter",
                "url": "https://aktutter.cz",
                "description": "Prezentace pražské advokátní kanceláře s praxí od roku 1991. Nuxt, časté dotazy ve strukturovaných datech, hreflang.",
                "creator": { "@id": "__SITE_ORIGIN__/#identity" },
                "inLanguage": "cs"
              }
            },
            {
              "@type": "ListItem",
              "position": 3,
              "item": {
                "@type": "CreativeWork",
                "name": "SLYX Fashions",
                "url": "https://slyx.com",
                "description": "Značkový web americké dílny na latexovou módu. Vue, GSAP, video hero, Cloudflare.",
                "creator": { "@id": "__SITE_ORIGIN__/#identity" },
                "inLanguage": "en"
              }
            },
            {
              "@type": "ListItem",
              "position": 4,
              "item": {
                "@type": "CreativeWork",
                "name": "bejcek.it",
                "url": "__SITE_ORIGIN__/",
                "description": "Portfolio se 3D scénou počítanou v prohlížeči. React, TypeScript, three.js, Lighthouse 100/100/100/100 na desktopu.",
                "creator": { "@id": "__SITE_ORIGIN__/#identity" },
                "inLanguage": "cs"
              }
            }
          ]
        }
      }
    </script>

    <!-- Drobečky: bez nich Google v SERPu ukáže holou URL místo cesty webem. -->
    <script type="application/ld+json">
